<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-100 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-blue-700 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-5 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">

            <h1 class="text-2xl font-bold">
                Health Analysis Census
            </h1>

            <ul class="flex gap-6 text-lg font-medium">
                <li>
                    <a href="./index.html"
                        id="home"
                        class="hover:text-yellow-300 transition">
                        Home
                    </a>
                </li>

                <li>
                    <a href="./health_contact.html"
                        id="contact"
                        class="text-yellow-300">
                        Contact Us
                    </a>
                </li>
            </ul>

        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-3xl mx-auto px-5 py-10">

        <div class="bg-white rounded-2xl shadow-xl p-8">

            <h2 class="text-4xl font-bold text-center text-blue-700">
                Contact Us
            </h2>

            <p class="text-center text-gray-600 mt-4 mb-8">
                Feel free to contact us to know more about your health conditions
                and available treatment methods.
            </p>

            <form id="contactForm" class="space-y-6">

                <!-- Name -->
                <div>
                    <label
                        for="name"
                        class="block mb-2 font-semibold text-gray-700">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Email -->
                <div>
                    <label
                        for="email"
                        class="block mb-2 font-semibold text-gray-700">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Condition -->
                <div>
                    <label
                        for="condition"
                        class="block mb-2 font-semibold text-gray-700">
                        Health Condition
                    </label>

                    <input
                        type="text"
                        id="condition"
                        name="condition"
                        required
                        placeholder="e.g. Diabetes"
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Message -->
                <div>
                    <label
                        for="message"
                        class="block mb-2 font-semibold text-gray-700">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        required
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 resize-none focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <!-- Button -->
                <button
                    type="submit"
                    onclick="thankyou()"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg text-lg font-semibold transition duration-300 shadow-md">
                    Submit
                </button>

            </form>

        </div>

    </main>
    <script src="./health_contact.js"></script>
</body>
</html>
